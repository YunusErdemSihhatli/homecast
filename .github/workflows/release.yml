name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the HomeCast release signing certificate (public). Update it if the key is ever rotated.
      HOMECAST_CERT_SHA256: ed114b6253451fcbf810b06b6f87582aef106cc18dd049d598a63b31c1a03079
    defaults:
      run:
        # Explicit bash runs steps with -eo pipefail, so a failing command in a pipe fails the step.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Decode signing keystore
        env:
          HOMECAST_KEYSTORE_BASE64: ${{ secrets.HOMECAST_KEYSTORE_BASE64 }}
          HOMECAST_KEYSTORE_PASSWORD: ${{ secrets.HOMECAST_KEYSTORE_PASSWORD }}
          HOMECAST_KEY_ALIAS: ${{ secrets.HOMECAST_KEY_ALIAS }}
          HOMECAST_KEY_PASSWORD: ${{ secrets.HOMECAST_KEY_PASSWORD }}
        run: |
          missing=0
          for name in HOMECAST_KEYSTORE_BASE64 HOMECAST_KEYSTORE_PASSWORD HOMECAST_KEY_ALIAS HOMECAST_KEY_PASSWORD; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              echo "::error::Secret $name is not set; refusing to publish a release that is not release-signed."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "$HOMECAST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homecast-release.jks"

      - name: Check, test and build signed release APK
        env:
          HOMECAST_KEYSTORE_FILE: ${{ runner.temp }}/homecast-release.jks
          HOMECAST_KEYSTORE_PASSWORD: ${{ secrets.HOMECAST_KEYSTORE_PASSWORD }}
          HOMECAST_KEY_ALIAS: ${{ secrets.HOMECAST_KEY_ALIAS }}
          HOMECAST_KEY_PASSWORD: ${{ secrets.HOMECAST_KEY_PASSWORD }}
          HOMECAST_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew spotlessCheck lint testDebugUnitTest assembleRelease

      - name: Verify signature and rename APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > signer.txt
          cat signer.txt
          if grep -q "Android Debug" signer.txt; then
            echo "::error::The release APK is signed with the debug key."
            exit 1
          fi
          # apksigner prints "Signer #1 certificate ..." or "V2 Signer: certificate ..." depending on the
          # schemes present; either way there must be exactly one distinct signing certificate: the pinned one.
          DIGESTS="$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' signer.txt | sort -u)"
          if grep -q "Signer #2" signer.txt || [ "$DIGESTS" != "$HOMECAST_CERT_SHA256" ]; then
            echo "::error::The release APK is not signed with the HomeCast release certificate (HOMECAST_CERT_SHA256)."
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk "HomeCast-${TAG}.apk"

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Print the body of the "## [VERSION]" section, stopping at the next
          # section or at the link reference definitions at the end of the file.
          awk -v version="$VERSION" '
            /^## \[/ || /^\[[^]]+\]: / {
              if (found) exit
              if (index($0, "## [" version "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No section for $VERSION in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "HomeCast-${TAG}.apk" \
            --title "HomeCast ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/homecast-release.jks"
